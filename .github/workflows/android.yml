
name: Build Gas Services APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip GasServicesAndroid.zip -d source

      - name: Fix Java Kotlin Compatibility
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path("source/GasServicesAndroid/app/build.gradle")
          s = p.read_text()
          s = s.replace("    defaultConfig {", """    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }
    defaultConfig {""")
          p.write_text(s)
          PY

      - name: Build APK
        run: gradle -p source/GasServicesAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasServices-APK
          path: source/GasServicesAndroid/app/build/outputs/apk/debug/app-debug.apk
