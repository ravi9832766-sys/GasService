
name: Build Gas Services APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract Project
        run: unzip GasServicesAndroid.zip -d source

      - name: Fix Kotlin Target
        run: |
          sed -i "/defaultConfig {/i\\    kotlinOptions { jvmTarget = '1.8' }" source/GasServicesAndroid/app/build.gradle

      - name: Build APK
        run: gradle -p source/GasServicesAndroid assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: GasServices-APK
          path: source/GasServicesAndroid/app/build/outputs/apk/debug/app-debug.apk
